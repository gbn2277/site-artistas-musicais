<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trabalho Artistas Musicais</title>
  <style>

    
    body {
        font-family: Georgia, serif;
        margin: 0 auto;
        justify-content: center;
        
    }

    h1 {
        text-align: center;
        
    }
    
    img{
            
          transition: transform 0.2s ease;
          cursor: pointer;
        }
        img:hover{
            transform: scale(1.15);
        }
    

    p.intro {
        text-align: center;
        font-size: 18px;
        margin-bottom: 40px;
    }

    .artista {
        margin-left: 42%;
        display: flex;
        align-items: center;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .artista img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-right: 20px;
    }

    .artista h2 {
        font-size: 20px;
    }

    .saiba-mais {
        
        display: inline-block;
        text-decoration: none;
        color: white;
        background-color: black;
        padding: 8px 16px;
        border-radius: 4px;
        font-family: Georgia, serif;
    }

    .botao:hover {
        background-color: grey;
    }

  </style>
</head>
<body>

  <h1>Artistas Musicais</h1>
  <p class="intro">Conheça a história e a carreira de artistas incríveis!</p>

    <div class="artista">
        <img src="assets/sza.png" alt="Foto da SZA">
        <div>
            <h2>SZA</h2>
            <a class="saiba-mais" href="aluno-gabriela.html">Saiba mais</a>
        </div>
    </div>

    <div class="artista">
        <img src="assets/luan.jpg" alt="Foto do Luan">
        <div>
            <h2>Luan Santana</h2>
            <a class="saiba-mais" href="aluno-miguel.html">Saiba mais</a>
        </div>
    </div>
    
    <div class="artista">
        <img src="assets/foto-artista.jpg" alt="Foto do The Beatles">
        <div>
            <h2>The Beatles</h2>
            <a class="saiba-mais" href="aluno-daniel.html">Saiba mais</a>
        </div>
    </div>

    <div class="artista">
        <img src="assets/michael.jpeg" alt="Foto do Michael Jackson">
        <div>
            <h2>Michael Jackson</h2>
            <a class="saiba-mais" href="aluno-matheus.html">Saiba mais</a>
        </div>
    </div>

</body>
</html>
